<!DOCTYPE html> <html lang="en"> <head> <meta charset="UTF-8"> <meta name="viewport" content="width=device-width, initial-scale=1.0"> <title>CalcPro</title> <link rel="stylesheet" href="/static/styles.css"> </head> <body> <main class="calculator"> <header> <h1>CalcPro</h1> <p>Simple. Fast. Accurate.</p> </header>
    <section class="display">
        <input
            id="display"
            type="text"
            placeholder="0"
            autocomplete="off"
            spellcheck="false"
        >
    </section>

    <section class="buttons">
        <button class="clear" data-action="clear">AC</button>
        <button data-value="(">(</button>
        <button data-value=")">)</button>
        <button class="operator" data-value="/">÷</button>

        <button data-value="7">7</button>
        <button data-value="8">8</button>
        <button data-value="9">9</button>
        <button class="operator" data-value="*">×</button>

        <button data-value="4">4</button>
        <button data-value="5">5</button>
        <button data-value="6">6</button>
        <button class="operator" data-value="-">−</button>

        <button data-value="1">1</button>
        <button data-value="2">2</button>
        <button data-value="3">3</button>
        <button class="operator" data-value="+">+</button>

        <button class="zero" data-value="0">0</button>
        <button data-value=".">.</button>
        <button class="equals" data-action="calculate">=</button>
    </section>

    <p id="error" class="error"></p>
</main>

<script src="/static/script.js"></script>

</body> </html>
